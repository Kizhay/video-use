<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'MB'; src: url('/assets/fonts/Montserrat-Black.ttf'); font-weight: 900; }
  @font-face { font-family: 'MB'; src: url('/assets/fonts/Montserrat-ExtraBold.ttf'); font-weight: 800; }
  @font-face { font-family: 'MB'; src: url('/assets/fonts/Montserrat-Medium.ttf'); font-weight: 500; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 1080px; height: 1920px; position: relative; font-family: 'MB', sans-serif; }
  #stage { position: absolute; inset: 0; }
  /* верхняя половина: фон + 3D + 2D-слой сцены */
  #top { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
  #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; }
  #ui { position: absolute; inset: 0; }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #chrome { position: absolute; inset: 0; pointer-events: none; }
  #headline, #subs { position: absolute; left: 0; width: 1080px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="bg"></div>
    <canvas id="gl" width="1080" height="960"></canvas>
    <div id="ui"></div>
    <div id="fx"></div>
  </div>
  <div id="chrome"></div>
  <div id="subs"></div>
  <div id="headline"></div>
</div>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module" src="/lib/engine.js"></script>
</body>
</html>
